<section class="hero">

<section class="contact">

    <div class="contact-info">
        <h2>Get In Touch</h2>

        <p><i class="fa-solid fa-location-dot"></i> Chennai, Tamil Nadu</p>

        <p><i class="fa-solid fa-phone"></i> +91 6379233679</p>

        <p><i class="fa-solid fa-envelope"></i> support@reusehub.com</p>

        <p><i class="fa-solid fa-clock"></i> Mon - Sat : 9:00 AM - 6:00 PM</p>
    </div>



    <form class="contact-form" id="contactForm">

    <input type="text" id="name" placeholder="Your Name" required>

    <input type="email" id="email" placeholder="Your Email" required>

    <input type="text" id="subject" placeholder="Subject" required>

    <textarea id="message" rows="6" placeholder="Your Message" required></textarea>

    <button type="submit">
        <i class="fa-solid fa-paper-plane"></i> Send Message
    </button>
     
<p id="successMessage"></p>

</form>
